apiVersion: v1
kind: Pod
metadata:
  name: pgdata-rescue
  namespace: sensors
spec:
  containers:
  - name: shell
    image: alpine
    command: ["sleep", "86400"]
    volumeMounts:
    - name: data
      mountPath: /pgvol
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: sensor-dashboard-and-collection-pg-pvc